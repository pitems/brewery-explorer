name: Flutter Pipeline

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
